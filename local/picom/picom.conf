# Habilitar el compositor
backend = "glx";
vsync = true;

# Habilitar transparencias
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 10;

# Mantener opacidad estándar para ventanas en general
inactive-opacity = 1.0;  # Sin transparencia para ventanas inactivas
active-opacity = 1.0;    # Sin transparencia para ventanas activas

# Desactivar sombras en terminales (opcional)
shadow-exclude = [
    "class_g = 'Alacritty'"
];

# Desactivar sombras en terminales y menús (Rofi)
shadow-exclude = [
    "class_g = 'Alacritty'",  # Excluye la terminal
    "class_g = 'Rofi'",       # Excluye el menú Rofi
    "fullscreen"              # Excluye cualquier ventana en pantalla completa
];
# Habilitar la transparencia solo para la terminal Alacritty
opacity-rule = [
    "70:class_g = 'Alacritty'",  # <-- ¡La coma es crucial!
    "75:class_g = 'Rofi'"
];

# Selecciona el método y la fuerza del blur
 
blur-background = true;


# Si tienes la versión estándar de Arch, usa "gaussian" o "kernel".
blur-method = "dual_kawase";
blur-strength = 5; # Cuanto más alto, más borroso (1-10 es común)

# Excluye ventanas que NO deben tener el fondo borroso (opcional)
blur-background-exclude = [
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'st-256color'" # Ejemplo: si usas la terminal simple (st)
];




