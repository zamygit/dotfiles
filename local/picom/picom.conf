# ---------------------------------------------------------
# HABILITAR EL COMPOSITOR Y RENDIMIENTO
# ---------------------------------------------------------
backend = "glx";
vsync = true;

# ---------------------------------------------------------
# TRANSICIONES Y DESVANECIMIENTO (FADING)
# ---------------------------------------------------------
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 10;

# Opacidad general por defecto (1.0 = Opaco)
inactive-opacity = 1.0;
active-opacity = 1.0;

# ---------------------------------------------------------
# REGLAS DE TRANSPARENCIA POR APLICACIÓN
# ---------------------------------------------------------
opacity-rule = [
    "70:class_g = 'Alacritty'",
    "50:class_g = 'kitty'",
    "75:class_g = 'Rofi'"
];
# ---------------------------------------------------------
# REGLAS DE SOMBRAS (SHADOWS)
# ---------------------------------------------------------
shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;

shadow-exclude = [
    "class_g = 'Alacritty'",
    "class_g = 'kitty'",
    "class_g = 'Rofi'",
    "class_g = 'Polybar'",
    "fullscreen"
];

# ---------------------------------------------------------
# DESENFOQUE DE FONDO (BLUR)
# ---------------------------------------------------------
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 5;

blur-background-exclude = [
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'st-256color'"
];
