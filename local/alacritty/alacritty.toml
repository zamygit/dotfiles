# Añade esto arriba del todo
[env]
WINIT_X11_SCALE_FACTOR = "1.0"

[window]
opacity = 1.0

[colors.primary]
background = "#000000"
foreground = "#FF0000"

[font]
size = 12.0 # Usamos tu tamaño actual (12.0)

[font.normal]
family = "Consolas"

[font.bold]
family = "Consolas"
style = "Bold"

[font.italic]
family = "Consolas"
style = "Italic"

[font.bold_italic]
family = "Consolas"
style = "Bold Italic"